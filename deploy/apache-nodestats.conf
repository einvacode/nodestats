# Apache reverse proxy -> NodeStats (127.0.0.1:3000)
# Aktifkan modul: a2enmod proxy proxy_http headers ssl
<VirtualHost *:80>
    ServerName monitor.example.com
    # Ganti ke IP server jika tidak pakai domain, atau hapus ServerName

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    ProxyTimeout 60

    # Opsional: batasi akses hanya dari LAN
    # <Location />
    #     Require ip 192.168.0.0/16 10.0.0.0/8
    # </Location>

    ErrorLog  ${APACHE_LOG_DIR}/nodestats_error.log
    CustomLog ${APACHE_LOG_DIR}/nodestats_access.log combined
</VirtualHost>

# HTTPS (setelah punya sertifikat, mis. certbot --apache):
# <VirtualHost *:443>
#     ServerName monitor.example.com
#     SSLEngine on
#     SSLCertificateFile    /etc/letsencrypt/live/monitor.example.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/monitor.example.com/privkey.pem
#     ProxyPreserveHost On
#     ProxyPass        / http://127.0.0.1:3000/
#     ProxyPassReverse / http://127.0.0.1:3000/
# </VirtualHost>
